name: Global Pulse Update 6 — Global System Graph

on:
  push:
    paths:
      - 'update6_global_graph.py'
      - '.github/workflows/update6-global-graph.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-pulse-update6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Expand graph layer
        run: python update6_global_graph.py

      - name: Refresh public data
        run: python update_snapshot.py

      - name: Refresh Global War News Map evidence
        run: python update_osint.py

      - name: Validate
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path('index.html').read_text()
          data = json.loads(Path('data/snapshot.json').read_text())
          assert html.count('id="gp-graph-css"') == 1
          assert html.count('id="gp-graph-js"') == 1
          assert html.count('id="globalGraph"') == 1
          assert len(data.get('stories', [])) >= 100
          graph = data.get('globalGraph', {})
          assert len(graph.get('nodes', [])) >= 70
          assert isinstance(graph.get('edges', []), list)
          assert data.get('updatedAt')
          print('VALID:', len(data['stories']), 'stories;', len(graph['nodes']), 'nodes;', len(graph['edges']), 'edges')
          PY

      - name: Commit refreshed dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html update_snapshot.py data/snapshot.json data/history.json data/sources.json
          git diff --cached --quiet || git commit -m 'Add global system graph and expand regional data'
          git push
