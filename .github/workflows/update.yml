name: Update Intelligence Snapshot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run clean pipeline
        run: python pipeline/build_snapshot.py

      - name: Commit data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: refresh intelligence snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
