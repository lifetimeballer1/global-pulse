name: Refresh snapshot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update snapshot from public RSS
        run: python update_snapshot.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history.json
          if git diff --staged --quiet; then
            echo "No file changes"
          else
            git commit -m "Auto-refresh feeds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
