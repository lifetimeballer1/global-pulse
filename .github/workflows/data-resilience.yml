name: Global Pulse — Data Resilience Checks

# IMPORTANT: production refresh/deploy is owned by update-snapshot.yml.
# A second scheduled deployment was able to race the production pipeline and
# publish an older/incomplete site build. Keep this workflow manual-only so it
# can be used for isolated diagnostics without ever replacing the live site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-pulse-resilience-check
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  resilience-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate resilience scripts
        run: |
          set -euo pipefail
          python -m py_compile source_failover.py update_market_data.py
          test -s data/snapshot.json
          test -s data/sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          m=d.get('marketData',{})
          assert isinstance(d,dict)
          assert isinstance(m,dict)
          assert m.get('noApiKey') is True
          print('Committed snapshot is valid JSON.')
          print('Market indicators:', len(m.get('indicators',[])))
          print('Snapshot updatedAt:', d.get('updatedAt'))
          print('Source failover replacements:', len(d.get('sourceFailover',{}).get('replacements',[])))
          PY

      - name: Confirm production scheduler contract
        run: |
          set -euo pipefail
          grep -q "2-59/5 \* \* \* \*" .github/workflows/update-snapshot.yml
          grep -q "actions/deploy-pages@v4" .github/workflows/update-snapshot.yml
          if grep -q "actions/deploy-pages@v4" .github/workflows/data-resilience.yml; then
            echo 'ERROR: resilience workflow must never deploy Pages'
            exit 1
          fi
          echo 'Production scheduler owns Pages deployment; resilience workflow is diagnostics-only.'
