name: Global Pulse — Data Resilience

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: global-pulse-production
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace failed news sources with no-key fallbacks
        run: python source_failover.py

      - name: Refresh near-real-time global market quotes
        run: python update_market_data.py

      - name: Validate resilience outputs
        run: |
          set -euo pipefail
          python -m py_compile source_failover.py update_market_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          m=d.get('marketData',{})
          assert m.get('noApiKey') is True
          assert len(m.get('indicators',[])) >= 10
          assert all(x.get('symbol') and x.get('price') is not None for x in m['indicators'])
          assert isinstance(d.get('sourceFailover',{}).get('replacements',[]), list)
          print('RESILIENCE OK:', len(m['indicators']), 'market indicators')
          print('LIVE:', m.get('liveCount'), 'STALE:', m.get('staleCount'))
          print('FAILOVER:', len(d.get('sourceFailover',{}).get('replacements',[])))
          PY

      - name: Publish resilient data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/sources.json
          if git diff --staged --quiet; then echo "No resilience changes"; exit 0; fi
          git commit -m "chore: refresh resilient market and source data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then echo "Published resilience data"; exit 0; fi
              git rebase --abort || true
            else git rebase --abort || true; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy resilient site
        id: deployment
        uses: actions/deploy-pages@v4
