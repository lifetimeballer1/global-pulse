name: Global Pulse Update 3 - OSINT Evidence

on:
  push:
    branches: [main]
    paths:
      - 'update3_evidence.py'
      - '.github/workflows/update3-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-pulse-update3-evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Update 3 evidence layer
        run: python update3_evidence.py
      - name: Validate generated HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="gp-evidence-css"') == 1
          assert s.count('id="gp-evidence-js"') == 1
          assert s.count('id="evidenceCenter"') == 1
          assert '<script id="gp-evidence-js">' in s
          print('Update 3 HTML validation passed')
          PY
      - name: Commit evidence update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No evidence changes"
          else
            git commit -m "feat: add OSINT evidence and provenance center"
            git push
          fi
