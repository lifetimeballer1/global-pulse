name: Global Pulse — Refresh, Validate & Deploy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-snapshot.yml'
      - 'claim_intelligence.py'
      - 'claim_intelligence.js'
      - 'install_claim_intelligence.py'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'intelligence-web.html'
      - 'intelligence_web_v2.js'
      - 'update_intelligence_web.py'
      - 'build_intelligence_graph.py'
      - 'install_intelligence_web.py'
      - 'update_market_data.py'
      - 'breaking_news.py'
      - 'build_live_events.py'
      - 'install_live_events.py'
      - 'global_pulse_events.js'
      - 'build_intelligence_assessment.py'
      - 'install_intelligence_assessment.py'
      - 'global_pulse_assessment.js'
      - 'update_cfr.py'
      - 'update_feed_expansion.py'
      - 'news_feed_db.py'
      - 'run_snapshot_resilient.py'
      - 'merge_live_news.py'
      - 'update_political_layer.py'
      - 'update_political_intelligence.py'
      - 'update_osint.py'
      - 'update8_global_layers.py'
      - 'update7_live_branding.py'
      - 'update9_live_reporting.py'
      - 'install_breaking_alerts.py'
      - 'install_health_finalizer.py'
      - 'finalize_intelligence_health.py'
      - 'install_v27.py'
      - 'install_map_v3.py'
      - 'global_pulse_breaking.js'
      - 'global_pulse_graph.js'
      - 'global_pulse_graph_pro.js'
env:
  PYTHONUNBUFFERED: '1'
concurrency:
  group: global-pulse-production
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent live-news SQLite database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-global-pulse-news-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-global-pulse-news-db-
      - name: Verify runtime
        run: python --version && node --version && git --version
      - name: Expand live intelligence feeds
        run: python update_feed_expansion.py
      - name: Poll persistent live-news database
        timeout-minutes: 2
        continue-on-error: true
        run: python news_feed_db.py --once
      - name: Refresh resilient no-key intelligence feeds
        run: python run_snapshot_resilient.py
      - name: Refresh keyless live market indicators
        timeout-minutes: 2
        continue-on-error: true
        run: python update_market_data.py
      - name: Merge persistent live news
        run: python merge_live_news.py
      - name: Fetch rapid open-data breaking intelligence
        timeout-minutes: 2
        continue-on-error: true
        run: python breaking_news.py
      - name: Cluster recent reports into live events
        run: python build_live_events.py
      - name: Promote politics and economics
        run: python update_political_layer.py
      - name: Build political intelligence and corroboration
        run: python update_political_intelligence.py
      - name: Sync OSINT maps
        timeout-minutes: 4
        continue-on-error: true
        run: python update_osint.py
      - name: Sync CFR Global Conflict Tracker
        timeout-minutes: 4
        continue-on-error: true
        run: python update_cfr.py
      - name: Add strategic and hazard layers
        timeout-minutes: 3
        continue-on-error: true
        run: python update8_global_layers.py
      - name: Build evidence-linked Intelligence Web graph
        run: python update_intelligence_web.py
      - name: Build required compact Intelligence Web artifact
        run: python build_intelligence_graph.py
      - name: Install canonical Intelligence Web renderer
        run: python install_intelligence_web.py
      - name: Install live event intelligence layer
        run: python install_live_events.py
      - name: Build dynamic risk and impact assessments
        run: python build_intelligence_assessment.py
      - name: Install dynamic risk and impact UI
        run: python install_intelligence_assessment.py
      - name: Apply site integrations
        run: python update7_live_branding.py
      - name: Install live reporting integration
        run: python update9_live_reporting.py
      - name: Install rapid breaking intelligence header
        run: python install_breaking_alerts.py
      - name: Repair source-health UI
        run: python install_health_finalizer.py
      - name: Recalculate final source health and tension
        run: python finalize_intelligence_health.py
      - name: Build claim-level evidence clusters
        run: python claim_intelligence.py
      - name: Install claim and evidence monitor
        run: python install_claim_intelligence.py
      - name: Install V2.7 intelligence layer
        run: python install_v27.py
      - name: Preserve canonical 2D map
        run: python install_map_v3.py
      - name: Final syntax, privacy and data validation
        run: |
          set -euo pipefail
          python -m py_compile claim_intelligence.py install_claim_intelligence.py update_intelligence_web.py build_intelligence_graph.py install_intelligence_web.py update_market_data.py breaking_news.py build_live_events.py install_live_events.py build_intelligence_assessment.py install_intelligence_assessment.py update_cfr.py install_breaking_alerts.py
          node --check claim_intelligence.js
          node --check intelligence_web_v2.js
          node --check global_pulse_breaking.js
          node --check global_pulse_events.js
          node --check global_pulse_assessment.js
          test -s data/snapshot.json
          test -s data/claims.json
          test -s data/intelligence_graph.json
          test -s data/breaking_news.json
          test -s data/live_events.json
          test -s data/intelligence_assessment.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          claims=json.loads(Path('data/claims.json').read_text())
          g=json.loads(Path('data/intelligence_graph.json').read_text())
          s=json.loads(Path('data/snapshot.json').read_text())
          b=json.loads(Path('data/breaking_news.json').read_text())
          ev=json.loads(Path('data/live_events.json').read_text())
          a=json.loads(Path('data/intelligence_assessment.json').read_text())
          main=Path('index.html').read_text()
          assert isinstance(claims.get('claims'),list) and claims.get('updatedAt'), 'Claim artifact missing'
          assert all(c.get('id') and c.get('claim') and c.get('confidence') for c in claims['claims']), 'Malformed claim'
          assert all(c.get('independentSourceDomains',0) >= 0 for c in claims['claims']), 'Invalid source count'
          assert len(g.get('nodes',[]))>=10 and len(g.get('edges',[]))>=3, 'Intelligence Web too small'
          assert all(e.get('source') and e.get('target') and e.get('evidence') for e in g['edges']), 'Connection without evidence'
          assert isinstance(ev.get('events'),list) and ev.get('updatedAt'), 'Live event artifact missing'
          assert isinstance(a.get('assessments'),list) and a.get('updatedAt'), 'Assessment artifact missing'
          assert 'claim_intelligence.js?v=1' in main, 'Claim UI not installed'
          assert not re.search(r'(google-analytics|googletagmanager|gtag\(|analytics\.js|sentry\.io|hotjar|mixpanel|segment\.com)',main,re.I), 'Unexpected tracking code detected'
          assert not re.search(r'(navigator\.sendBeacon|new\s+Image\s*\(|fetch\s*\([^)]*(telemetry|analytics|track))',main,re.I), 'Unexpected client telemetry detected'
          print('FINAL VALIDATION PASSED')
          print('Claims:',len(claims['claims']))
          print('Intelligence Web:',len(g['nodes']),'nodes /',len(g['edges']),'evidence-backed connections')
          print('Snapshot:',s.get('updatedAt'))
          print('Breaking:',len(b.get('articles',[])))
          print('Live events:',len(ev.get('events',[])))
          print('Assessments:',len(a.get('assessments',[])))
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'chore: refresh Global Pulse intelligence data'
          for attempt in 1 2 3 4 5; do git fetch origin main; git rebase -X theirs origin/main && git push origin HEAD:main && exit 0 || true; git rebase --abort || true; sleep $((attempt*3)); done
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site; mkdir -p _site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _site -exec cp -a {} _site/ \;
          test -s _site/index.html; test -s _site/intelligence-web.html; test -s _site/data/snapshot.json; test -s _site/data/claims.json; test -s _site/data/intelligence_graph.json; test -s _site/data/breaking_news.json; test -s _site/data/live_events.json; test -s _site/data/intelligence_assessment.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
