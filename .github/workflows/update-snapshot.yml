name: Global Pulse — Refresh, Validate & Deploy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: global-pulse-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore persistent live-news SQLite database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-global-pulse-news-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-global-pulse-news-db-

      - name: Verify runtime
        run: |
          python --version
          node --version
          git --version

      - name: Expand live intelligence feeds
        run: python update_feed_expansion.py

      - name: Poll persistent news and public X RSS sources
        run: python news_feed_db.py --once

      - name: Refresh public intelligence data in parallel
        run: python update_snapshot_fast.py

      - name: Merge persistent live-news database into public snapshot
        run: python merge_live_news.py

      - name: Promote politics and economics to first-class layers
        run: python update_political_layer.py

      - name: Build automatic political intelligence and corroboration layer
        run: python update_political_intelligence.py

      - name: Sync intelligence maps
        run: python update_osint.py

      - name: Sync CFR Global Conflict Tracker
        run: python update_cfr.py

      - name: Add strategic and hazard layers + install canonical map
        run: python update8_global_layers.py

      - name: Build evidence-linked intelligence graph
        run: python update_intelligence_web.py

      - name: Apply final branding and layout cleanup
        run: python update7_live_branding.py

      - name: Validate production build
        run: |
          set -euo pipefail
          python -m py_compile update_snapshot.py update_snapshot_fast.py news_feed_db.py merge_live_news.py update_feed_expansion.py update_political_layer.py update_political_intelligence.py update_osint.py update_cfr.py update7_live_branding.py update8_global_layers.py update_intelligence_web.py global_map_ui.py
          node --check global_pulse_graph.js
          node --check global_pulse_enhancements.js
          node --check global_pulse_layers.js
          python - <<'PY'
          import json,re,sqlite3
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          live=json.loads(Path('data/live_articles.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/live_status.json').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          g=d.get('intelligenceGraph',{})
          pi=d.get('politicalIntelligence',{})
          con=sqlite3.connect('news_feed.db')
          cols={r[1] for r in con.execute('PRAGMA table_info(articles)').fetchall()}
          db_count=con.execute('SELECT COUNT(*) FROM articles').fetchone()[0]
          con.close()
          required={'url','title','published_date','summary_snippet','credit_metadata'}
          assert required.issubset(cols), f"SQLite schema missing columns: {required-cols}"
          assert db_count >= 1, 'SQLite database contains no articles'
          assert live.get('count',0) >= 1, 'live JSON export contains no articles'
          assert status.get('feedsChecked',0) >= 10, 'live collector did not check expected sources'
          assert d.get('updatedAt'), 'snapshot has no updatedAt'
          assert len(d.get('stories',[]))>=100, f"too few stories: {len(d.get('stories',[]))}"
          assert len(d.get('conflicts',[]))>=25, f"too few conflicts: {len(d.get('conflicts',[]))}"
          assert len(d.get('cfrConflicts',[]))>=20, f"too few CFR conflicts: {len(d.get('cfrConflicts',[]))}"
          assert len(d.get('usPolitics',[])) + len(d.get('worldPolitics',[])) > 0, 'politics layer contains no stories'
          assert len(d.get('economics',[])) > 0, 'economics layer contains no stories'
          assert pi.get('totalSignals',0) > 0, 'political intelligence engine produced no signals'
          assert isinstance(pi.get('topSignals'),list) and len(pi['topSignals']) > 0, 'political intelligence topSignals missing'
          assert len(g.get('nodes',[]))>=10 and len(g.get('edges',[]))>=10, 'intelligence graph is incomplete'
          assert any(m.get('source')=='Guerilla Map Strategic Reference' for m in d.get('markers',[])), 'strategic layer missing'
          assert any(m.get('source')=='Council on Foreign Relations — Global Conflict Tracker' for m in d.get('markers',[])), 'CFR layer missing'
          assert 'gp-map-rescue-js' in html, 'canonical map UI missing'
          assert 'global_pulse_graph.js' in html, 'intelligence graph UI missing'
          assert 'global_pulse_layers.js' in html, 'political intelligence UI missing'
          assert 'POLITICAL & ECONOMIC REPORTING' in Path('global_pulse_layers.js').read_text(encoding='utf-8'), 'political reporting panel missing'
          assert 'NPR Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'), 'politics feed expansion missing'
          assert 'Fox News Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'), 'Fox politics feed missing'
          assert 'CNN Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'), 'CNN politics feed missing'
          assert 'Axios Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'), 'Axios politics feed missing'
          assert 'Morse Report' in Path('update_snapshot.py').read_text(encoding='utf-8'), 'Morse Report feed missing'
          assert 'NASA' in Path('news_feed_db.py').read_text(encoding='utf-8'), 'X account source missing'
          assert 'news_feed.db' in Path('news_feed_db.py').read_text(encoding='utf-8'), 'SQLite integration missing'
          assert 'while True' in Path('news_feed_db.py').read_text(encoding='utf-8'), 'continuous collector loop missing'
          assert 'time.sleep(POLL_SECONDS)' in Path('news_feed_db.py').read_text(encoding='utf-8'), 'five-minute polling pause missing'
          assert html.count('Made by J.S.')==1, 'branding duplicated'
          assert html.count('id="gp-brand-live-css"')==1, 'branding CSS duplicated'
          assert html.count('id="gp-auto-refresh"')==1, 'auto refresh duplicated'
          assert html.count('class="gp-footer-credit"')==0, 'old footer credit remains'
          assert not re.search(r'\b(lorem ipsum|sample data|fake data)\b',html,re.I), 'placeholder content remains'
          assert not re.search(r'\b(coming soon|under construction)\b',html,re.I), 'unfinished content remains'
          print(f"VALID: {len(d['stories'])} stories, {len(d['usPolitics'])} U.S. politics, {len(d['worldPolitics'])} world politics, {len(d['economics'])} economics, {len(d['conflicts'])} conflicts, {len(d['cfrConflicts'])} CFR conflicts, {len(d['markers'])} markers, {len(g['nodes'])} graph nodes, {len(g['edges'])} graph edges, {pi['totalSignals']} political intelligence signals, {pi['corroboratedSignals']} corroborated, {db_count} SQLite rows")
          print(f"LIVE SOURCES: {status['healthySources']}/{status['feedsChecked']} healthy; {status['newArticles']} new; {status['purged']} purged")
          print(f"UPDATED: {d['updatedAt']}")
          print(f"SOURCE STATUS: {d.get('sourceStatus','unknown')}")
          PY

      - name: Commit refreshed data and generated site changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: refresh global pulse data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
