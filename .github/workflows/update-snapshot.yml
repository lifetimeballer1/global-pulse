name: Global Pulse — Refresh, Validate & Deploy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-snapshot.yml'
      - 'global_pulse_v22.js'
      - 'global_pulse_source_health.js'
      - 'global_pulse_v26.js'
      - 'global_pulse_v27.js'
      - 'global_pulse_graph.js'
      - 'install_intelligence_web.py'
      - 'update_intelligence_web.py'
      - 'update_market_data.py'
      - 'resilient_feed_catalog.py'
      - 'run_snapshot_resilient.py'
      - 'news_feed_db.py'
      - 'install_v27.py'
      - 'install_map_v3.py'
      - 'finalize_intelligence_health.py'
      - 'install_health_finalizer.py'
env:
  PYTHONUNBUFFERED: '1'
concurrency:
  group: global-pulse-production
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent live-news SQLite database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-global-pulse-news-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-global-pulse-news-db-
      - name: Verify runtime
        run: |
          python --version
          node --version
          git --version
      - name: Expand live intelligence feeds
        run: python update_feed_expansion.py
      - name: Poll persistent live-news SQLite database
        run: python news_feed_db.py --once
      - name: Refresh public intelligence data with resilient no-key feeds
        run: python run_snapshot_resilient.py
      - name: Refresh keyless live market indicators
        run: python update_market_data.py
      - name: Merge persistent live-news database into public snapshot
        run: python merge_live_news.py
      - name: Promote politics and economics to first-class layers
        run: python update_political_layer.py
      - name: Build automatic political intelligence and corroboration layer
        run: python update_political_intelligence.py
      - name: Sync intelligence maps
        run: python update_osint.py
      - name: Sync CFR Global Conflict Tracker
        run: python update_cfr.py
      - name: Add strategic and hazard layers + install canonical map
        run: python update8_global_layers.py
      - name: Build evidence-linked intelligence graph
        run: python update_intelligence_web.py
      - name: Install functional 3D Intelligence Web entry point
        run: python install_intelligence_web.py
      - name: Apply final branding and layout cleanup
        run: python update7_live_branding.py
      - name: Install resilient live FastAPI reporting integration
        run: python update9_live_reporting.py
      - name: Install source-health UI repair
        run: python install_health_finalizer.py
      - name: Recalculate final source health and Global Tension Index
        run: python finalize_intelligence_health.py
      - name: Install Global Pulse V2.7 intelligence layer
        run: python install_v27.py
      - name: Preserve canonical 2D map and remove deprecated 3D globe experiment
        run: python install_map_v3.py
      - name: Validate production build
        run: |
          set -euo pipefail
          python -m py_compile update_snapshot.py update_snapshot_fast.py update_market_data.py resilient_feed_catalog.py run_snapshot_resilient.py news_feed_db.py merge_live_news.py update_feed_expansion.py update_political_layer.py update_political_intelligence.py update_osint.py update_cfr.py update7_live_branding.py update8_global_layers.py update9_live_reporting.py update_intelligence_web.py install_intelligence_web.py global_map_ui.py finalize_intelligence_health.py install_health_finalizer.py install_v27.py install_map_v3.py
          node --check global_pulse_graph.js
          node --check global_pulse_v27.js
          node --check global_pulse_v27_quality.js
          node --check global_pulse_source_health.js
          python - <<'PY'
          import json,re,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          live=json.loads(Path('data/live_articles.json').read_text(encoding='utf-8'))
          status=json.loads(Path('data/live_status.json').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          intel=Path('intelligence-web.html').read_text(encoding='utf-8')
          g=d.get('intelligenceGraph',{}); pi=d.get('politicalIntelligence',{})
          con=sqlite3.connect('news_feed.db'); cols={r[1] for r in con.execute('PRAGMA table_info(articles)').fetchall()}; db_count=con.execute('SELECT COUNT(*) FROM articles').fetchone()[0]; con.close()
          required={'url','title','published_date','summary_snippet','credit_metadata'}; assert required.issubset(cols), f"SQLite schema missing columns: {required-cols}"
          assert db_count>=1; assert live.get('count',0)>=1; assert status.get('feedsChecked',0)>=10; assert d.get('updatedAt')
          assert len(d.get('stories',[]))>=100; assert len(d.get('conflicts',[]))>=25; assert len(d.get('cfrConflicts',[]))>=20
          assert len(d.get('usPolitics',[]))+len(d.get('worldPolitics',[]))>0; assert len(d.get('economics',[]))>0
          assert pi.get('totalSignals',0)>0 and isinstance(pi.get('topSignals'),list) and len(pi['topSignals'])>0
          assert len(g.get('nodes',[]))>=10 and len(g.get('edges',[]))>=10
          markers=d.get('markers',[]); assert isinstance(markers,list) and len(markers)>=100, f"map markers too low: {len(markers)}"
          marker_sources={str(x.get('source','')) for x in markers}
          assert ('Guerilla Map Strategic Reference' in marker_sources or any('Guerilla Map' in x for x in marker_sources)), 'strategic reference layer missing'
          assert 'gp-map-v3-js' in html, 'canonical map v3 UI missing'
          assert 'pulse-reporting-feed' in html, 'live reporting feed missing'
          assert 'GP-MAP-3D-START' not in html and 'global_pulse_map_3d.js' not in html, 'deprecated 3D globe still installed'
          assert 'GP-INTELLIGENCE-WEB-START' in html, '3D Intelligence Web entry missing'
          assert 'ForceGraph3D' in intel and 'data/snapshot.json' in intel, '3D Intelligence Web not wired to real snapshot'
          assert 'enableNodeDrag(true)' in intel, '3D node dragging is not enabled'
          assert '3d-force-graph@1.80.0' in intel, '3D renderer is not pinned'
          assert 'gpLoad3D' in intel, '3D loader missing'
          assert 'global_pulse_map_3d.js' not in intel, 'deprecated globe renderer referenced'
          assert 'POLITICAL & ECONOMIC REPORTING' in Path('global_pulse_layers.js').read_text(encoding='utf-8')
          assert 'NPR Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'); assert 'Fox News Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'); assert 'CNN Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'); assert 'Axios Politics' in Path('update_snapshot.py').read_text(encoding='utf-8'); assert 'Morse Report' in Path('update_snapshot.py').read_text(encoding='utf-8')
          assert 'Climate & humanitarian pressure' in Path('global_pulse_v24.js').read_text(encoding='utf-8'); assert 'CLIMATE → GEOPOLITICAL PRESSURE' in Path('global_pulse_v25.js').read_text(encoding='utf-8'); assert 'NASA' in Path('news_feed_db.py').read_text(encoding='utf-8'); assert 'news_feed.db' in Path('news_feed_db.py').read_text(encoding='utf-8')
          m=d.get('marketData',{}); indicators=m.get('indicators',[]); assert isinstance(m,dict); assert m.get('noApiKey') is True; assert len(indicators)>=20, f"market indicators too low: {len(indicators)}"
          assert all(x.get('symbol') and x.get('price') is not None for x in indicators), 'market indicator missing price'
          checked=[]
          for x in indicators:
            try: checked.append(datetime.fromisoformat(str(x.get('checkedAt','')).replace('Z','+00:00')))
            except: pass
          assert checked and (datetime.now(timezone.utc)-max(checked)).total_seconds()<1200, 'market collector is stale (>20m)'
          assert m.get('liveCount',0)+m.get('closedCount',0)+m.get('staleCount',0)==len(indicators), 'market status counts do not reconcile'
          quake_keys=set()
          for marker in d['markers']:
            if str(marker.get('source','')).lower().find('usgs')>=0 or 'earthquake' in str(marker.get('eventType',marker.get('type',''))).lower():
              key=str(marker.get('url') or marker.get('id') or marker.get('eventId') or (marker.get('title'),marker.get('lat',marker.get('latitude')),marker.get('lng',marker.get('lon')))); assert key not in quake_keys, f'duplicate earthquake marker: {key}'; quake_keys.add(key)
          assert html.count('Made by J.S.')==1; assert html.count('id="gp-brand-live-css"')==1; assert html.count('id="gp-auto-refresh"')==1; assert html.count('class="gp-footer-credit"')==0
          assert not re.search(r'\b(lorem ipsum|sample data|fake data)\b',html,re.I); assert not re.search(r'\b(coming soon|under construction)\b',html,re.I)
          assert d.get('scoreVersion')==5, f"unexpected score version: {d.get('scoreVersion')}"
          assert isinstance(d.get('tension'),(int,float)) and 0<=d['tension']<=100
          assert isinstance(d.get('breakdownScores'),dict) and len(d['breakdownScores'])>=6
          assert isinstance(d.get('driverSignals'),dict) and len(d['driverSignals'])>=6
          assert isinstance(d.get('sourceHealth'),list) and len(d['sourceHealth'])>=10
          failed=sum(1 for x in d['sourceHealth'] if x.get('status')=='failed'); assert failed<=5, f'too many failed sources after failover: {failed}'
          for x in d['sourceHealth']: assert x.get('status') in ('online','degraded','failed','unknown') and 'articles' in x and 'lastChecked' in x, f'invalid source health: {x}'
          for name,signal in d['driverSignals'].items(): assert isinstance(signal,dict) and 'matches' in signal and 'sources' in signal and 'topSignals' in signal, f'invalid driver evidence: {name}'
          print(f"VALID: tension={d['tension']} markers={len(markers)} stories={len(d['stories'])} graph_nodes={len(g.get('nodes',[]))} graph_edges={len(g.get('edges',[]))}")
          print(f"MARKETS: {m.get('liveCount')} live, {m.get('closedCount')} closed, {m.get('staleCount')} stale")
          print(f"SOURCE HEALTH: {d['sourceHealthSummary']}")
          PY
      - name: Commit refreshed data and generated site changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "No generated changes to commit"; exit 0; fi
          git commit -m "chore: refresh global pulse data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then echo "Published refreshed data on attempt $attempt"; exit 0; fi
              git rebase --abort || true
            else git rebase --abort || true; fi
            echo "Publish race on attempt $attempt; retrying..."; sleep $((attempt * 3))
          done
          echo "Unable to publish refreshed data after 5 attempts"; exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare GitHub Pages site directory
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _site -exec cp -a {} _site/ \;
          test -s _site/index.html
          test -s _site/intelligence-web.html
          test -s _site/data/snapshot.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
