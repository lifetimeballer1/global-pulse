name: Global Pulse — Canonical Live Refresh
run-name: Global Pulse refresh • ${{ github.event_name }} • ${{ github.run_number }}
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-snapshot.yml'
      - 'refresh_pipeline.py'
      - 'build_map_points.py'
      - 'finalize_map_ui.py'
      - 'pipeline/build_snapshot.py'
      - 'build_event_pipeline.py'
      - 'ensure_brain_groups.py'
      - 'global_pulse_core.js'
      - 'global_pulse_event_pipeline.js'
      - 'global_pulse_brain_ui.js'
      - 'global_pulse_tokens.css'
      - 'global_pulse_enhancements.js'
      - 'global_pulse_breaking.js'
      - 'global_map_ui.py'
      - 'news_feed_db.py'
      - 'merge_live_news.py'
      - 'source_failover.py'
      - 'update8_global_layers.py'
      - 'update_conflict_dataset.py'
      - 'update_macro_data.py'
      - 'update_market_data.py'
      - 'build_what_changed.py'
      - 'clean_index.py'
      - 'harden_site.py'
      - 'install_qa_hardening.py'
      - 'global_pulse_qa.js'
      - 'global_pulse_graph.js'
      - 'claim_intelligence.js'
      - 'js/**'
      - 'index.html'
      - 'tests/test_regressions.py'
      - 'data/enforcer_maps.json'
concurrency:
  group: global-pulse-canonical-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
env:
  PYTHONUNBUFFERED: '1'
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest news database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-global-pulse-news-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-global-pulse-news-db-
      - name: Verify runtime
        run: python --version && node --version && git --version
      - name: Run canonical refresh with per-stage verification
        run: python refresh_pipeline.py
      - name: Build dedicated browser map points
        run: python build_map_points.py
      - name: Repair map tile source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
          new='https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
          if old in s:
              s=s.replace(old,new)
              s=s.replace("'&copy; OpenStreetMap &copy; CARTO'","'&copy; OpenStreetMap contributors'")
              s=s.replace('&copy; OpenStreetMap &copy; CARTO','&copy; OpenStreetMap contributors')
              p.write_text(s,encoding='utf-8')
              print('Replaced CARTO tile layer with public OpenStreetMap tiles')
          else:
              print('No CARTO tile URL in generated index; map module owns the tile layer')
          PY
      - name: Finalize map UI and browser cache bust
        run: python finalize_map_ui.py
      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_regressions.py
      - name: Verify critical published inputs
        run: |
          set -euo pipefail
          python -m py_compile harden_site.py install_qa_hardening.py refresh_pipeline.py pipeline/build_snapshot.py build_what_changed.py update_market_data.py ensure_brain_groups.py build_map_points.py finalize_map_ui.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text())
          m=d.get('marketData',{})
          s=d.get('stories',[])
          assert len(m.get('indicators',[])) >= 20
          assert any(float(x.get('price',0) or 0)>0 for x in m.get('indicators',[]) if isinstance(x,dict))
          assert d.get('updatedAt') and d.get('lastSuccessfulRefresh')
          assert isinstance(s,list) and len(s)>0
          assert isinstance(d.get('failoverState'),dict)
          assert (d.get('conflictDataset') or {}).get('provider')
          assert (d.get('macroData') or {}).get('provider')
          brain=d.get('intelligenceBrain') or {}
          assert brain.get('complete') is True and brain.get('sourceBackedOnly') is True
          print('PASS snapshot',d['updatedAt'],'market',len(m['indicators']),'stories',len(s),'brain',len(brain.get('nodes',[])))
          live=json.loads(Path('data/live_status.json').read_text())
          assert live.get('rowsFetched',0)>0 and live.get('feedsChecked',0)>=20
          print('PASS news',live.get('feedsChecked'),live.get('rowsFetched'))
          mp=json.loads(Path('data/map_points.json').read_text())
          assert isinstance(mp.get('markers'),list) and len(mp['markers'])>0
          assert all(-90<=float(x['lat'])<=90 and -180<=float(x['lng'])<=180 for x in mp['markers'])
          print('PASS map points',len(mp['markers']))
          manifest=json.loads(Path('data/refresh_manifest.json').read_text())
          required=['snapshot.json','history.json','sources.json','live_articles.json','intelligence_graph.json','intelligence_brain.json']
          for name in required:
              meta=manifest['artifacts'][name];raw=Path('data',name).read_bytes();assert hashlib.sha256(raw).hexdigest()==meta['sha256'],name
          print('PASS refresh manifest')
          html=Path('index.html').read_text()
          for asset in ('global_pulse_core.js','global_pulse_event_pipeline.js','global_pulse_brain_ui.js','global_pulse_tokens.css'):
              assert asset in html,asset
          assert 'section-brain' in html and 'section-markets' in html and 'mapContainer' in html
          assert 'global_pulse_v22.js' not in html and 'global_pulse_v27.js' not in html
          assert 'gp-map-rescue-js' not in html and 'gp-map-rescue-css' not in html
          assert 'js/app.js?v=20260906-mapfix3' in html
          print('PASS canonical UI integration')
          PY
      - name: Commit generated data and UI
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No generated changes to commit'; exit 0; fi
          git commit -m 'chore: refresh Global Pulse live data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Verify main contains generated commit
        run: git fetch origin main && git merge-base --is-ancestor HEAD origin/main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare exact Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          test -f _site/index.html
          test -f _site/data/map_points.json
          test -f _site/js/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          mp=json.loads(Path('_site/data/map_points.json').read_text())
          markers=mp.get('markers') or []
          assert len(markers) >= 10
          assert all(-90 <= float(x['lat']) <= 90 and -180 <= float(x['lng']) <= 180 for x in markers)
          brain=json.loads(Path('_site/data/intelligence_brain.json').read_text())
          assert brain.get('complete') is True and brain.get('sourceBackedOnly') is True
          assert 10 <= len(brain.get('nodes',[])) <= 35
          assert len(brain.get('edges',brain.get('relationships',[]))) >= 5
          print(f'PASS exact Pages site: mapPoints={len(markers)} brainNodes={len(brain.get("nodes",[]))}')
          PY
          echo "Prepared exact Pages site: $(find _site -type f | wc -l) files"
      - name: Upload exact generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy exact generated site
        id: deployment
        uses: actions/deploy-pages@v4
