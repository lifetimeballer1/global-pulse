name: Global Pulse Data Refresh

on:
  push:
    branches: [main]
    paths:
      - 'update_snapshot.py'
      - 'update_osint.py'
      - 'patch_index_ui.py'
      - 'apply_ui_patch.py'
      - 'data/**'
      - 'index.html'
      - '.github/workflows/update-snapshot.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-pulse-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard UI fixes
        run: python patch_index_ui.py
      - name: Apply reliable theater modal and map focus
        run: python apply_ui_patch.py
      - name: Refresh public news and conflict data
        run: python update_snapshot.py
      - name: Sync Global War News Map
        run: python update_osint.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json data/history.json data/sources.json patch_index_ui.py apply_ui_patch.py .github/workflows/update-snapshot.yml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: harden conflict modal and theater map focus"
            git push
          fi
