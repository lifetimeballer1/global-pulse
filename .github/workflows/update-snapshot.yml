name: Global Pulse — Refresh, Validate & Deploy

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-snapshot.yml'

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: global-pulse-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent live-news database
        uses: actions/cache@v4
        with:
          path: news_feed.db
          key: ${{ runner.os }}-global-pulse-news-db
          restore-keys: |
            ${{ runner.os }}-global-pulse-news-db-
      - name: Verify runtime
        run: python --version && node --version && git --version
      - name: Expand feeds
        run: python update_feed_expansion.py
      - name: Verify feed expansion
        run: test -s data/sources.json
      - name: Poll live news
        timeout-minutes: 4
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Live-news poll ${attempt}/3"
            if python news_feed_db.py --once; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Verify live news
        run: |
          python -m py_compile news_feed_db.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          d=json.load(open('data/live_status.json'))
          assert d.get('updatedAt')
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(d['updatedAt'].replace('Z','+00:00'))).total_seconds()
          assert age <= 900, f'live_status stale: {age:.0f}s'
          assert d.get('feedsChecked',0) >= 20
          assert d.get('rowsFetched',0) > 0
          print('PASS live news',d.get('feedsChecked'),d.get('rowsFetched'),d.get('newArticles'))
          PY
      - name: Refresh base snapshot
        run: python run_snapshot_resilient.py
      - name: Verify base snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          d=json.load(open('data/snapshot.json'))
          assert d.get('updatedAt')
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(d['updatedAt'].replace('Z','+00:00'))).total_seconds()
          assert age <= 900, f'snapshot stale: {age:.0f}s'
          print('PASS base snapshot',d['updatedAt'])
          PY
      - name: Update market data
        timeout-minutes: 3
        run: python update_market_data.py
      - name: Verify market data
        run: test -s data/snapshot.json
      - name: Merge live news
        run: python merge_live_news.py
      - name: Verify merged news
        run: test -s data/snapshot.json
      - name: Build breaking intelligence
        timeout-minutes: 3
        run: python breaking_news.py
      - name: Verify breaking intelligence
        run: python - <<'PY'
          import json
          d=json.load(open('data/breaking_news.json'))
          assert d.get('updatedAt')
          print('PASS breaking intelligence')
          PY
      - name: Build live events
        run: python build_live_events.py
      - name: Verify live events
        run: python - <<'PY'
          import json
          d=json.load(open('data/live_events.json'))
          assert isinstance(d.get('events'),list) and d.get('updatedAt')
          print('PASS live events',len(d['events']))
          PY
      - name: Build source evidence
        run: python build_source_evidence.py
      - name: Verify source evidence
        run: python - <<'PY'
          import json
          d=json.load(open('data/source_evidence.json'))
          assert isinstance(d.get('eventSourceEvidence'),list) and d.get('updatedAt')
          print('PASS source evidence')
          PY
      - name: Build event intelligence
        run: python build_event_intelligence.py
      - name: Verify event intelligence
        run: python - <<'PY'
          import json
          d=json.load(open('data/event_intelligence.json'))
          assert isinstance(d.get('events'),list) and d.get('updatedAt')
          print('PASS event intelligence')
          PY
      - name: Build event consistency
        run: python build_event_consistency.py
      - name: Verify event consistency
        run: python - <<'PY'
          import json
          d=json.load(open('data/event_consistency.json'))
          assert isinstance(d.get('events'),list) and isinstance(d.get('summary'),dict) and d.get('updatedAt')
          print('PASS event consistency')
          PY
      - name: Update political layer
        run: python update_political_layer.py
      - name: Verify political layer
        run: test -s data/snapshot.json
      - name: Build political intelligence
        run: python update_political_intelligence.py
      - name: Verify political intelligence
        run: test -s data/snapshot.json
      - name: Update OSINT maps
        timeout-minutes: 4
        run: python update_osint.py
      - name: Verify OSINT maps
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/snapshot.json')); os=d.get('osintMaps') or {}
          assert os and os.get('version') in (2,3,4)
          print('PASS OSINT',os.get('version'))
          PY
      - name: Update CFR conflict coverage
        timeout-minutes: 4
        run: python update_cfr.py
      - name: Verify CFR conflict coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/snapshot.json'))
          assert isinstance(d.get('markers'),list) and d['markers']
          print('PASS conflict coverage',len(d['markers']))
          PY
      - name: Add strategic layers
        timeout-minutes: 3
        run: python update8_global_layers.py
      - name: Verify strategic layers
        run: test -s data/snapshot.json
      - name: Build intelligence web
        run: python update_intelligence_web.py
      - name: Verify intelligence web
        run: test -s data/intelligence_graph.json || test -s intelligence-web.html
      - name: Build intelligence graph
        run: python build_intelligence_graph.py
      - name: Verify intelligence graph
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/intelligence_graph.json'))
          assert len(d.get('nodes',[])) >= 10
          assert len(d.get('edges',[])) >= 3
          assert all(e.get('source') and e.get('target') and e.get('evidence') for e in d['edges'])
          print('PASS intelligence graph')
          PY
      - name: Install intelligence web
        run: python install_intelligence_web.py
      - name: Verify intelligence web renderer
        run: test -s intelligence-web.html || test -s index.html
      - name: Install live event layers
        run: python install_live_events.py && python install_event_intelligence.py
      - name: Verify live event layers
        run: test -s global_pulse_event_intelligence.js
      - name: Build assessments
        run: python build_intelligence_assessment.py
      - name: Verify assessments
        run: python - <<'PY'
          import json
          d=json.load(open('data/intelligence_assessment.json'))
          assert isinstance(d.get('assessments'),list) and d.get('updatedAt')
          print('PASS assessments')
          PY
      - name: Install assessment UI
        run: python install_intelligence_assessment.py
      - name: Verify assessment UI
        run: test -s global_pulse_assessment.js
      - name: Apply dashboard integrations
        run: python update7_live_branding.py && python update9_live_reporting.py && python install_breaking_alerts.py && python install_health_finalizer.py
      - name: Verify dashboard integrations
        run: test -s index.html
      - name: Build source health and claims
        run: python finalize_intelligence_health.py && python claim_intelligence.py && python install_claim_intelligence.py
      - name: Verify source health and claims
        run: |
          test -s data/source_health.json
          test -s data/claims.json
          python - <<'PY'
          import json
          d=json.load(open('data/claims.json'))
          assert isinstance(d.get('claims'),list) and d.get('updatedAt')
          print('PASS claims',len(d['claims']))
          PY
      - name: Install V2.7 and canonical map
        run: python install_v27.py && python install_map_v3.py
      - name: Verify V2.7 and canonical map
        run: test -s global_pulse_v27.js && test -s index.html
      - name: Normalize generated HTML
        run: python clean_index.py
      - name: Verify repository integrity
        run: python validate_repository.py
      - name: Final syntax and data validation
        run: |
          set -euo pipefail
          python -m py_compile *.py
          for f in data/snapshot.json data/live_status.json data/live_events.json data/source_evidence.json data/event_intelligence.json data/event_consistency.json data/intelligence_graph.json data/intelligence_assessment.json data/claims.json data/source_health.json; do test -s "$f"; done
          for f in claim_intelligence.js global_pulse_event_intelligence.js global_pulse_event_consistency.js global_pulse_assessment.js global_pulse_v27.js; do node --check "$f"; done
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text())
          stamp=d.get('updatedAt'); assert stamp
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()
          assert age <= 900, f'final snapshot stale: {age:.0f}s'
          assert len(d.get('markers',[])) > 0
          print('FINAL PIPELINE VALIDATION PASSED',stamp,'markers=',len(d['markers']))
          PY
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'chore: refresh Global Pulse intelligence data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Verify published commit
        run: git fetch origin main && test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exact generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy exact generated site
        id: deployment
        uses: actions/deploy-pages@v4
