name: Global Pulse — Regional OSINT Expansion

on:
  workflow_run:
    workflows: ["Global Pulse — Refresh, Validate & Deploy"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: global-pulse-regional-osint
  cancel-in-progress: false

jobs:
  expand:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect fresh regional OSINT
        run: python regional_osint_v2.py

      - name: Install map clustering
        run: python install_map_clustering.py

      - name: Validate real regional points
        run: |
          set -euo pipefail
          python -m py_compile regional_osint_v2.py install_map_clustering.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          r=d.get('regionalOsint',{})
          assert r.get('version') == 2
          regions=r.get('regions',{})
          assert set(regions) == {'Africa','South America','South Asia'}
          markers=[m for m in d.get('markers',[]) if m.get('layer')=='osint-regional']
          assert markers, 'No regional OSINT markers reached snapshot'
          assert all(-90 <= float(m['lat']) <= 90 and -180 <= float(m['lng']) <= 180 for m in markers)
          assert all(m.get('source') and m.get('observedAt') for m in markers)
          print('Regional points:', {k:v.get('points',0) for k,v in regions.items()})
          print('Total OSINT markers:', len(markers))
          print('GDELT failures:', len(r.get('failures',[])))
          PY

      - name: Commit regional OSINT and map updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json index.html
          if git diff --cached --quiet; then
            echo 'No regional OSINT/map changes to commit.'
          else
            git commit -m 'Restore live regional OSINT collection'
            git push origin main
          fi
