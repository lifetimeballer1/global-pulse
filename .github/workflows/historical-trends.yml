name: Global Pulse — Historical Trends
on:
  workflow_run:
    workflows: ["Global Pulse — Refresh, Validate & Deploy"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-pulse-historical-trends
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build_historical_trends.py
      - name: Validate
        run: |
          python -m py_compile build_historical_trends.py
          python - <<'PY'
          import json
          d=json.load(open('data/historical_trends.json'))
          assert d.get('version')==1 and isinstance(d.get('windows'),dict)
          assert all(k in d['windows'] for k in ('6h','24h','7d','30d'))
          print('HISTORICAL TRENDS VALIDATION PASSED:',d['availableSamples'],'samples')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historical_trends.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'feat: refresh historical trend summaries'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
