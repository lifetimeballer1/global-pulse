name: Global Pulse — Event Resolution
on:
  workflow_run:
    workflows: ["Global Pulse — Refresh, Validate & Deploy"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build resolved event groups
        run: python build_event_resolution.py
      - name: Validate resolved artifact
        run: python validate_event_resolution.py
      - name: Install event resolution UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="global_pulse_event_resolution.js?v=1"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check global_pulse_event_resolution.js
      - name: Commit resolution artifact and UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/event_resolution.json index.html
          if git diff --staged --quiet; then echo 'No resolution changes'; exit 0; fi
          git commit -m 'chore: refresh resolved event groups'
          git pull --rebase origin main
          git push origin HEAD:main
