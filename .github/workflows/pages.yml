name: Deploy Global Pulse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect fresh regional OSINT events
        run: python regional_osint_v2.py

      - name: Normalize legacy OSINT coverage
        run: python update_conflict_coverage.py

      - name: Inject dashboard enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<link rel="stylesheet" href="global_pulse_intelligence.css">',
              '<script src="global_pulse_coverage_ui.js"></script>',
              '<script src="global_pulse_intelligence.js"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  marker = '</body>'
                  if marker in text:
                      text = text.replace(marker, tag + '\n' + marker, 1)
                  else:
                      text += '\n' + tag + '\n'
          p.write_text(text, encoding='utf-8')
          for tag in tags:
              print(tag, 'present' if tag in text else 'missing')
          PY

      - name: Validate enriched snapshot and dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          markers=d.get('markers', [])
          regional=[m for m in markers if m.get('layer')=='osint-regional']
          print(f'Total markers: {len(markers)}')
          print(f'Regional OSINT markers: {len(regional)}')
          if not regional:
              raise SystemExit('No fresh regional OSINT markers reached the Pages artifact')
          for m in regional:
              assert -90 <= float(m['lat']) <= 90 and -180 <= float(m['lng']) <= 180
              assert m.get('source') and m.get('observedAt')
              assert m.get('url') or m.get('sourceUrl')
          html=Path('index.html').read_text(encoding='utf-8')
          for asset in ('global_pulse_coverage_ui.js','global_pulse_intelligence.js','global_pulse_intelligence.css'):
              if asset not in html:
                  raise SystemExit(f'{asset} was not integrated')
          print('Regional counts:', d.get('osintMaps',{}).get('regionalCounts',{}))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
