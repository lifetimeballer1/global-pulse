name: Deploy Global Pulse to GitHub Pages

# The main refresh workflow owns scheduled collection and production deploys.
# Keep this workflow manual-only so a plain push cannot deploy an older snapshot
# in parallel with the data refresh pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map precision and photo layer
        run: python map_precision_photos.py

      - name: Validate committed map data
        run: |
          set -euo pipefail
          python -m py_compile update_conflict_coverage.py map_precision_photos.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          markers=d.get('markers', [])
          regional=[m for m in markers if m.get('layer')=='osint-regional']
          o=d.get('osintMaps') or {}
          counts=o.get('regionalCounts') or {}
          print(f'Total markers: {len(markers)}')
          print(f'Committed regional OSINT markers: {len(regional)}')
          print('Regional counts:', counts)
          for m in regional:
              assert -90 <= float(m['lat']) <= 90 and -180 <= float(m['lng']) <= 180
          if counts:
              required={'Africa','South America','South Asia'}
              missing=required-set(counts)
              if missing:
                  raise SystemExit(f'Incomplete regional count schema: {sorted(missing)}')
              if any(int(v or 0) < 0 for v in counts.values()):
                  raise SystemExit('Regional counts cannot be negative')
          html=Path('index.html').read_text(encoding='utf-8')
          required_assets=('global_pulse_coverage_ui.js','global_pulse_intelligence.js','global_pulse_intelligence.css','GP-MAP-PRECISION-PHOTOS')
          for asset in required_assets:
              if asset not in html:
                  raise SystemExit(f'{asset} was not integrated')
          print('Committed map data and dashboard assets validated.')
          PY

      - name: Inject dashboard enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          tags=['<link rel="stylesheet" href="global_pulse_intelligence.css">','<script src="global_pulse_coverage_ui.js"></script>','<script src="global_pulse_intelligence.js"></script>','<link rel="stylesheet" href="global_pulse_list_density.css">','<script src="global_pulse_list_density.js"></script>']
          for tag in tags:
              if tag not in text:
                  marker='</body>'
                  text=text.replace(marker,tag+'\n'+marker,1) if marker in text else text+'\n'+tag+'\n'
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate Pages artifact inputs
        run: |
          set -euo pipefail
          test -s index.html
          test -s global_pulse_coverage_ui.js
          test -s global_pulse_intelligence.js
          test -s global_pulse_intelligence.css
          test -s global_pulse_list_density.js
          test -s global_pulse_list_density.css
          test -s data/snapshot.json
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          for asset in ('global_pulse_list_density.js','global_pulse_list_density.css'):
              if asset not in html:
                  raise SystemExit(f'{asset} was not integrated into Pages artifact')
          print('Compact list UX assets validated.')
          PY
          echo 'Pages artifact inputs are present.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
