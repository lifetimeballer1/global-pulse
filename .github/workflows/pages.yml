name: Deploy Global Pulse to GitHub Pages

# The canonical refresh workflow now builds, validates, commits, and deploys the
# exact same generated working tree. Keeping this workflow manual-only prevents
# duplicate deployments and stale workflow_run checkouts.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: global-pulse-pages-manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          d=json.loads(Path('data/snapshot.json').read_text())
          stamp=d.get('updatedAt'); assert stamp
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()
          assert age <= 900, f'snapshot stale: {age:.0f}s'
          assert isinstance(d.get('markers'),list) and d['markers']
          print('MANUAL PAGES VALIDATION PASSED',stamp)
          PY
      - name: Install map precision layer
        run: python map_precision_photos.py
      - name: Verify site inputs
        run: |
          test -s index.html
          test -s data/snapshot.json
          test -s global_pulse_coverage_ui.js
          test -s global_pulse_intelligence.js
          test -s global_pulse_list_density.js
          test -s global_pulse_list_density.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
