name: Phase 3 UX Validation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'global_pulse_*.js'
      - 'global_pulse_*.css'
      - 'install_event_intelligence.py'
      - 'tests/test_phase3_ux.py'
      - '.github/workflows/phase3-ux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run Phase 3 UX regression tests
        run: python -m pytest -q tests/test_phase3_ux.py
      - name: Validate required assets are wired
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('install_event_intelligence.py').read_text()
          assert 'global_pulse_phase3.css?v=1' in s
          assert 'global_pulse_ux_hardening.js?v=1' in s
          print('Phase 3 assets wired into canonical installer')
          PY
