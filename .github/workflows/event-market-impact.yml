name: Global Pulse — Event Market Context
on:
  workflow_run:
    workflows: ["Global Pulse — Refresh, Validate & Deploy"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-pulse-event-market-context
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build_event_market_impact.py
      - name: Validate
        run: |
          python -m py_compile build_event_market_impact.py
          python - <<'PY'
          import json
          d=json.load(open('data/event_market_impact.json'))
          assert d.get('version')==1 and isinstance(d.get('events'),list)
          for e in d['events']:
              assert 'eventId' in e and isinstance(e.get('relatedIndicators'),list)
          print('EVENT MARKET CONTEXT VALIDATION PASSED:',len(d['events']))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/event_market_impact.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'feat: refresh event market context'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
