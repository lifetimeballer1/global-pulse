name: Global Pulse — Map Event Links
on:
  workflow_run:
    workflows: ["Global Pulse — Refresh, Validate & Deploy"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-pulse-map-event-links
  cancel-in-progress: false
jobs:
  link:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python link_events_to_map.py
      - name: Validate map links
        run: |
          python -m py_compile link_events_to_map.py
          python - <<'PY'
          import json
          d=json.load(open('data/snapshot.json'))
          info=d.get('mapEventLinking',{})
          assert info.get('linkedMarkers',0) >= 0
          for m in d.get('markers',[]):
              if m.get('eventId'):
                  assert m.get('eventTitle') and m.get('eventLinkConfidence') in {'candidate','strong-candidate'}
          print('MAP EVENT LINK VALIDATION PASSED:',info)
          PY
      - name: Commit map links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'feat: link map signals to live events'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
