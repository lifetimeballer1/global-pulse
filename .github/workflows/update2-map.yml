name: Global Pulse Update 2 - Intelligence Map

on:
  push:
    branches: [main]
    paths:
      - 'update2_map.py'
      - '.github/workflows/update2-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-pulse-update2-map
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Update 2 map layer
        run: python update2_map.py

      - name: Commit map update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No map changes"
          else
            git commit -m "feat: professionalize conflict and OSINT map"
            git push
          fi
