<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>Global Pulse — Intelligence Web</title>
<style>
:root{--bg:#040a10;--panel:rgba(6,14,22,.96);--line:#1b3043;--text:#eef6ff;--muted:#8ea5b8;--green:#39ff88}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#graph{position:fixed;inset:0}.hud{position:fixed;left:14px;top:14px;z-index:50;width:min(560px,calc(100vw - 28px));transition:.2s ease}.hud.hidden{transform:translateY(-125%);opacity:0;pointer-events:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 18px 55px rgba(0,0,0,.4);backdrop-filter:blur(16px)}.brand{font-size:12px;font-weight:950;letter-spacing:.15em;color:var(--green)}.sub{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.4}.stats{margin-top:8px;color:#9bb0c1;font-size:9px;line-height:1.45}.controls{position:fixed;left:14px;top:14px;z-index:60;padding:8px 10px;border:1px solid var(--green);border-radius:9px;background:rgba(4,10,16,.94);color:var(--green);font-weight:900;font-size:9px;letter-spacing:.08em;cursor:pointer}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#03080d;z-index:1000;color:var(--muted);font-size:11px;text-align:center}.loading.error{color:#ff5368}@media(max-width:720px){.hud{left:8px;top:52px;width:calc(100vw - 16px)}.controls{left:8px;top:8px}}
</style>
</head>
<body>
<div id="graph"></div>
<div id="loading" class="loading">LOADING INTELLIGENCE BRAIN<br><small>Building the major-node global intelligence map…</small></div>
<button id="controls-toggle" class="controls" type="button">☰ HIDE CONTROLS</button>
<div id="controls" class="hud"><div class="card"><div class="brand">GLOBAL PULSE // INTELLIGENCE WEB</div><div class="sub">Major intelligence centers of gravity. The map is consolidated; underlying news, map, conflict and market records remain attached as evidence.</div><div id="stats" class="stats">Loading live intelligence…</div></div></div>
<script>
(()=>{const b=document.getElementById('controls-toggle'),c=document.getElementById('controls');b.onclick=()=>{const hidden=c.classList.toggle('hidden');b.textContent=hidden?'☰ SHOW CONTROLS':'☰ HIDE CONTROLS'}})();
</script>
<script src="intelligence_brain_web.js?v=20260906v4" defer></script>
</body>
</html>
