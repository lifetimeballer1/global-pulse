<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Global Pulse — Intelligence Web</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509;color:#e9f2ff;font-family:system-ui,-apple-system,sans-serif}#graph{position:fixed;inset:0}.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.card{background:rgba(3,9,15,.88);border:1px solid #183047;border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0008}.title{font-weight:900;letter-spacing:.12em;font-size:12px}.sub{font-size:10px;color:#8ea3b8;margin-top:3px}.status{font-size:10px;color:#48df83}.legend{position:fixed;z-index:5;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}.pill{font-size:9px;padding:5px 7px;border:1px solid #183047;border-radius:999px;background:rgba(3,9,15,.9)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.detail{position:fixed;z-index:6;right:12px;bottom:12px;width:min(340px,calc(100% - 24px));display:none}.detail b{font-size:13px}.detail small{color:#8ea3b8}.detail a{color:#62a0ff}.error{color:#ff6678}.hint{position:fixed;z-index:5;top:75px;left:50%;transform:translateX(-50%);font-size:10px;color:#8ea3b8;text-align:center;pointer-events:none}</style></head><body><div id="graph"></div><div class="hud"><div class="card"><div class="title">GLOBAL PULSE // INTELLIGENCE WEB</div><div class="sub" id="meta">Loading verified relationships…</div></div><div class="card"><div class="status" id="status">DATA LINK: CONNECTING</div></div></div><div class="hint">Drag nodes · scroll/pinch to zoom · drag empty space to rotate · tap a node for intelligence details</div><div class="legend"><span class="pill"><i class="dot" style="background:#ff304f"></i>Conflict</span><span class="pill"><i class="dot" style="background:#ff7a00"></i>Military</span><span class="pill"><i class="dot" style="background:#b56cff"></i>Political</span><span class="pill"><i class="dot" style="background:#ffd400"></i>Economic</span><span class="pill"><i class="dot" style="background:#00e5ff"></i>OSINT</span><span class="pill"><i class="dot" style="background:#39ff88"></i>Region</span></div><div class="card detail" id="detail"></div><script>const DATA_URL='data/snapshot.json';let Graph=null;const color=t=>({conflict:'#ff304f',military:'#ff7a00',political:'#b56cff',economic:'#ffd400',osint:'#00e5ff',region:'#39ff88',event:'#fff'}[t]||'#39ff88');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function makeGraph(d){const nodes=[],links=[],ids=new Set();function add(id,name,type,extra={}){id=String(id);if(ids.has(id))return id;ids.add(id);nodes.push({id,name:String(name||id),type,...extra});return id}const markers=Array.isArray(d?.markers)?d.markers:[];markers.filter(m=>Number.isFinite(Number(m.lat??m.latitude))&&Number.isFinite(Number(m.lng??m.lon??m.longitude))).slice(0,500).forEach((m,i)=>{const title=m.title||m.name||m.location||m.region||`Signal ${i+1}`;const text=`${m.layer||''} ${m.eventType||''} ${title}`;const type=/conflict|war|strike|attack/i.test(text)?'conflict':/military|army|navy|air/i.test(text)?'military':/market|economic|oil|trade/i.test(text)?'economic':/politic|diplomat/i.test(text)?'political':'osint';const id=add('signal:'+String(m.id||m.url||i),title,type,{lat:Number(m.lat??m.latitude),lng:Number(m.lng??m.lon??m.longitude),source:m.source||m.sourceLabel||'',url:m.url||m.sourceUrl||''});if(m.region){const r=add('region:'+m.region,m.region,'region');links.push({source:id,target:r,type:'region'})}});(d?.conflictCoverage?.watchlist||[]).forEach(w=>{const id=add('conflict:'+w.id,w.title,'conflict',{region:w.region,status:w.status,confidence:w.confidence});if(w.region){const r=add('region:'+w.region,w.region,'region');links.push({source:id,target:r,type:'region'})}});const seen=new Set();return{nodes,links:links.filter(l=>{const k=l.source+'>'+l.target;if(seen.has(k))return false;seen.add(k);return true})}}async function getData(){if(window.DATA)return window.DATA;const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error('snapshot '+r.status);return r.json()}function load(urls,i=0){return new Promise((resolve,reject)=>{if(window.ForceGraph3D)return resolve();if(i>=urls.length)return reject(Error('3D engine unavailable'));const s=document.createElement('script');s.src=urls[i];s.onload=()=>window.ForceGraph3D?resolve():load(urls,i+1).then(resolve,reject);s.onerror=()=>load(urls,i+1).then(resolve,reject);document.head.appendChild(s)})}async function boot(){try{const d=await getData();const gd=makeGraph(d);document.getElementById('meta').textContent=`${gd.nodes.length} nodes · ${gd.links.length} relationships · snapshot ${d.updatedAt||'unknown'}`;await load(['https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js','https://unpkg.com/3d-force-graph@1.79.0/dist/3d-force-graph.min.js']);const host=document.getElementById('graph');Graph=new ForceGraph3D(host,{controlType:'orbit'}).backgroundColor('#020509').showNavInfo(false).graphData(gd).nodeColor(n=>color(n.type)).nodeRelSize(4.5).nodeOpacity(.95).nodeLabel(n=>`<b>${esc(n.name)}</b><br>${esc(n.type)}${n.region?' · '+esc(n.region):''}${n.status?' · '+esc(n.status):''}`).linkColor(l=>l.type==='region'?'rgba(57,255,136,.25)':'rgba(0,229,255,.45)').linkWidth(1).linkDirectionalParticles(1).linkDirectionalParticleWidth(2).enableNodeDrag(true).enableNavigationControls(true).onNodeClick(n=>{const box=document.getElementById('detail');box.style.display='block';box.innerHTML=`<b>${esc(n.name)}</b><br><small>${esc(n.type)}${n.region?' · '+esc(n.region):''}${n.source?' · '+esc(n.source):''}</small>${n.confidence!=null?`<br><small>Confidence: ${Math.round(Number(n.confidence)*100)}%</small>`:''}${n.url?`<br><br><a href="${esc(n.url)}" target="_blank" rel="noopener">Open source</a>`:''}`});Graph.d3Force('charge').strength(-100);Graph.d3Force('link').distance(90);Graph.d3ReheatSimulation();document.getElementById('status').textContent='DATA LINK: ONLINE'}catch(e){document.getElementById('status').textContent='DATA LINK: ERROR';document.getElementById('status').className='error';document.getElementById('meta').textContent=e.message}}boot();</script></body></html>
